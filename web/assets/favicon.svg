<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Margin">
  <title>Margin</title>
  <!-- Ink tile -->
  <rect width="64" height="64" rx="15" fill="#1B1E3C"/>
  <!-- The margin rule: a teacher's red line down the left of the page -->
  <path d="M15 13 V51" stroke="#E8483B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- M on paper ink -->
  <path d="M24 45 V20 L35 33.5 L46 20 V30" fill="none" stroke="#FBF8F1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The M's last stroke becomes a red-pen check: "graded" -->
  <path d="M38 40 L44 46.5 L55 30" fill="none" stroke="#E8483B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
