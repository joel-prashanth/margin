# Publish frontend/web to Cloudflare Pages: every PR gets a preview link,
# and merging to main updates production. One-time setup is in the root README.
name: Web Deploy

on:
  # Every PR, as docs/BRANCHING.md promises, not only ones touching frontend/web.
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - ".github/workflows/web-deploy.yml"

# A newer push to the same PR or branch cancels the deploy still going for the old one.
concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: web / deploy
    # GitHub withholds secrets from fork PRs, so a deploy could only fail there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # to post the preview link on the PR

    steps:
      - uses: actions/checkout@v4

      # Cloudflare treats main as production and any other branch as a preview.
      # Previews use the PR number rather than the branch name, which gives each
      # PR a stable URL and keeps user-controlled text out of the command.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/web
            --project-name=margin-web
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}

      # Edits the same comment on each push, so a PR only ever has one.
      - name: Post preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "<!-- web-preview-link -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Website preview:** ${process.env.PREVIEW_URL}\n\nUpdated for commit \`${sha}\`.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
